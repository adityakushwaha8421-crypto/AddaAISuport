# Local/prod-like stack: Postgres + the agent. Secrets come from .env; session files live in ./secrets.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fa}
      POSTGRES_DB: fa_support
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fa']
      interval: 5s
      retries: 10

  agent:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://fa:${POSTGRES_PASSWORD:-fa}@db:5432/fa_support
      STORE: postgres
    volumes:
      - ./secrets:/app/secrets
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports: ['127.0.0.1:9464:9464'] # /healthz, /metrics — local only

volumes:
  pgdata:
